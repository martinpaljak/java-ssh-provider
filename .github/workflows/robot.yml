on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - next
  pull_request:
    branches:
      - main

concurrency:
  group: robot
  cancel-in-progress: false

permissions:
  contents: write

name: Build robot
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 21, 25 ]
    name: Java ${{ matrix.java }} build
    env:
      PUBLISH: ${{ matrix.java == '21' && ( github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next' || startsWith(github.ref, 'refs/tags/v') ) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0 # To make git describe give the intended output
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu
          cache: maven
      - name: Set up publishing
        if: env.PUBLISH == 'true'
        uses: martinpaljak/maven-ssh-deploy@v2
        with:
          host: mvn.javacard.pro
          key: ${{ secrets.SSH_KEY }}
          fingerprint: SHA256:auiF3nHWvDmvq2stDl+QEECCqMcDp+FY1/bDRnvxpRw
      - name: Build and deploy
        run: ./mvnw -B -U deploy -Dmaven.deploy.skip=${{ env.PUBLISH != 'true' }}
      - name: Release
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            provider/target/sshprovider.jar
          fail_on_unmatched_files: true
          body: Release ${{ github.ref_name }}
          prerelease: true # manually promoted

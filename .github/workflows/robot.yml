on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - next
  pull_request:
    branches:
      - main

permissions:
  contents: write

name: Build robot
jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build and deploy
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
          cache: maven
      - name: Compile and verify
        run: ./mvnw -B verify
      - name: Set up publishing
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main')
        uses: martinpaljak/maven-ssh-deploy@v2
        with:
          host: mvn.javacard.pro
          key: ${{ secrets.SSH_KEY }}
          fingerprint: SHA256:auiF3nHWvDmvq2stDl+QEECCqMcDp+FY1/bDRnvxpRw
      - name: Deploy
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main')
        run: ./mvnw -B deploy -DskipTests
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            provider/target/sshprovider.jar
          fail_on_unmatched_files: true
          body: Release ${{ github.ref_name }}
          prerelease: true # manually promoted
